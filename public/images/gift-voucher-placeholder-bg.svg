  <text x="110" y="486" fill="#0E2FC9" font-family="Arial, sans-serif" font-size="96" font-weight="700">ПОРТРЕТНА СЕСИЯ</text>
  <text x="110" y="590" fill="#0E2FC9" font-family="Arial, sans-serif" font-size="68">ПОДАРЪЧЕН ВАУЧЕР</text>
  <text x="110" y="860" fill="#0E2FC9" font-family="Arial, sans-serif" font-size="34" font-weight="700">by Yana Lozeva</text>
  <text x="1490" y="860" fill="#0E2FC9" font-family="Arial, sans-serif" font-size="28" text-anchor="end">ПРИМЕРНО ИЗОБРАЖЕНИЕ</text>
